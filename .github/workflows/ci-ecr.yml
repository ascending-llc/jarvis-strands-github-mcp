name: Build, Push, and Deploy
on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS Region"
        type: string
        required: true
        default: "us-east-1"
      ecr_repository:
        description: "ECR repository"
        type: string
        required: true
        default: "agentcore/aws_deep_intel"
      dockerfile:
        description: "Dockerfile path"
        type: string
        required: true
        default: "Dockerfile"
      env:
        description: "cdk/config.toml section to deploy (dev or prod)"
        type: choice
        required: true
        default: "dev"
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAAS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-ecr
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          # AgentCore Runtime requires linux/arm64 container images.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          provenance: false

  deploy:
    name: Deploy Runtime Stack
    needs: build_and_push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAAS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-cdk-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK app dependencies
        run: pip install -r requirements.txt

      # cdk/config.local.toml is gitignored (account-specific MODEL, TAVILY_MCP_URL); neither
      # value is sensitive, so CI materializes it from plain repo variables (vars.*), matching
      # jarvis-deployment's own convention (vars.AZURE_ACR_NAME etc.) rather than secrets.
      - name: Write config.local.toml
        run: |
          cat > config.local.toml <<EOF
          [${{ inputs.env }}.env]
          MODEL = "${{ vars.MODEL }}"
          TAVILY_MCP_URL = "${{ vars.TAVILY_MCP_URL }}"
          EOF

      - name: cdk deploy JarvisAgentsRuntime
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          cdk deploy JarvisAgentsRuntime \
            -c env=${{ inputs.env }} \
            -c imageTag=${{ needs.build_and_push.outputs.image_tag }} \
            --require-approval never
