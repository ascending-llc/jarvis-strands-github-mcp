[project]
name = "aws-customer-intel-orchestrator"
version = "0.1.0"
description = "Strands-based multi-agent workflow for AWS customer intelligence."
requires-python = ">=3.10"

dependencies = [
  "strands-agents>=1.44.0",
  "mcp",
  "httpx",
  "pydantic",
  "boto3",
  "fastapi>=0.127.0",
  "uvicorn>=0.30.0",
  "python-dotenv",
  "a2a-sdk>=0.3.22",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
