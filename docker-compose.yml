services:
  deep-intel:
    build: .
    environment:
      AGENT_ID: deep_intel
      AWS_RESEARCH_URL: http://aws-research:9000
      BUSINESS_INTEL_URL: http://business-intel:9000
    env_file:
      - .env
    ports:
      - "9001:9000"
    depends_on:
      - aws-research
      - business-intel
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs

  aws-research:
    build: .
    environment:
      AGENT_ID: aws_research
    env_file:
      - .env
    ports:
      - "9002:9000"
    volumes:
      - ./logs:/app/logs

  business-intel:
    build: .
    environment:
      AGENT_ID: business_intel
    env_file:
      - .env
    ports:
      - "9003:9000"
    volumes:
      - ./logs:/app/logs
