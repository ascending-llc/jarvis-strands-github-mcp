services:
  deep-intel:
    build: .
    environment:
      AGENT_ID: deep_intel
      AGENT_BASE_URL: http://deep-intel:9000
    env_file:
      - .env
    ports:
      - "9001:9000"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs

  aws-research:
    build: .
    environment:
      AGENT_ID: aws_research
      AGENT_BASE_URL: http://aws-research:9000
    env_file:
      - .env
    ports:
      - "9002:9000"
    volumes:
      - ./logs:/app/logs

  business-intel:
    build: .
    environment:
      AGENT_ID: business_intel
      AGENT_BASE_URL: http://business-intel:9000
    env_file:
      - .env
    ports:
      - "9003:9000"
    volumes:
      - ./logs:/app/logs
